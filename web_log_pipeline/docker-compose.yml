services:
  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "1"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 24

  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/bash
      - -c
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic web.logs.ok --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic web.logs.error --partitions 1 --replication-factor 1
        echo "토픽 생성 완료"

  producer:
    build: .
    image: web-log-pipeline:latest
    pull_policy: build
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    command: ["python", "-m", "pipeline.producer"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PRODUCER_INTERVAL_SECONDS: "${PRODUCER_INTERVAL_SECONDS:-0.5}"
      MAX_EVENTS: "${MAX_EVENTS:-0}"
      ERROR_RATE: "${ERROR_RATE:-0.03}"
      FAULT_ERROR_RATE: "${FAULT_ERROR_RATE:-0.8}"
    volumes:
      - ./pipeline_output:/workspace/pipeline_output

  ok-consumer:
    build: .
    image: web-log-pipeline:latest
    pull_policy: build
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    command: ["python", "-m", "pipeline.consumer"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CLASSIFICATION: ok
    volumes:
      - ./pipeline_output:/workspace/pipeline_output

  error-consumer:
    build: .
    image: web-log-pipeline:latest
    pull_policy: build
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    command: ["python", "-m", "pipeline.consumer"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CLASSIFICATION: error
    volumes:
      - ./pipeline_output:/workspace/pipeline_output

  monitor:
    build: .
    image: web-log-pipeline:latest
    pull_policy: build
    command: ["python", "-m", "monitor.app"]
    environment:
      PUBLIC_PORT: "${MONITOR_PORT:-8000}"
    ports:
      - "${MONITOR_PORT:-8000}:8000"
    volumes:
      - ./pipeline_output:/workspace/pipeline_output
